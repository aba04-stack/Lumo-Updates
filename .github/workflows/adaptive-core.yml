name: Adaptive Core CI

on:
  push:
    paths:
      - "adaptive-core/**"
      - ".github/workflows/adaptive-core.yml"
  pull_request:
    paths:
      - "adaptive-core/**"
      - ".github/workflows/adaptive-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: adaptive-core/pyproject.toml
      - name: Install package and test dependency
        run: python -m pip install -e "adaptive-core[dev]"
      - name: Compile
        run: python -m compileall -q adaptive-core/src adaptive-core/tests
      - name: Run regression tests
        run: python -m pytest adaptive-core/tests -q

      - name: Run bounded live research demo
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.title, '[LIVE DEMO]')
        working-directory: adaptive-core
        shell: bash
        run: |
          set -euo pipefail
          DEMO_DIR="$(mktemp -d)"
          trap 'rm -rf "$DEMO_DIR"' EXIT
          python -m adaptive_core.autonomous_cli \
            --steps 2 \
            --page-budget 4 \
            --language ru \
            --topic "Искусственный интеллект" \
            --topic "машинное обучение" \
            --strategy-db "$DEMO_DIR/strategy.sqlite3" \
            --web-db "$DEMO_DIR/web.sqlite3" > "$DEMO_DIR/result.json"
          python - "$DEMO_DIR/result.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          result = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          compact = {
              "run_type": "bounded live Wikipedia research; no language model",
              "steps_completed": result.get("steps_completed"),
              "pages_requested_budget": result.get("pages_requested_budget"),
              "pages_budget_remaining": result.get("pages_budget_remaining"),
              "documents_found": result.get("documents_found"),
              "results": [],
              "affect": result.get("affect"),
              "affect_model_samples": result.get("affect_model_samples"),
              "motivation": result.get("motivation"),
              "goals_needing_verification": result.get("goals_needing_verification"),
          }
          for item in result.get("results", []):
              claims = item.get("claim_candidates", [])
              compact["results"].append({
                  "topic": item.get("topic"),
                  "status": item.get("status"),
                  "documents_found": item.get("documents_found"),
                  "source_urls": item.get("source_urls"),
                  "evidence_status": item.get("evidence_status"),
                  "relevant_excerpts": item.get("relevant_excerpts", [])[:2],
                  "discovered_terms": item.get("discovered_terms", [])[:12],
                  "new_terms": item.get("new_terms", [])[:12],
                  "suggested_next_topics": item.get("next_topics"),
                  "claim_candidates_count": len(claims),
                  "sample_claim_candidates": [
                      {
                          "text": claim.get("text"),
                          "source_url": claim.get("source_url"),
                          "extraction_confidence": claim.get("extraction_confidence"),
                          "independently_verified": claim.get("independently_verified"),
                      }
                      for claim in claims[:3]
                  ],
                  "potential_contradictions": item.get("potential_contradictions"),
                  "retrieval_utility": item.get("retrieval_utility"),
                  "epistemic_uncertainty_proxy": item.get("epistemic_uncertainty_proxy"),
                  "goal_status": item.get("goal_status"),
                  "error": item.get("error"),
              })
          print(json.dumps(compact, ensure_ascii=False, indent=2))
          PY
